<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#19161c"><title>The Witch’s Lair · Ritual Chamber — Master Scene</title>
<style>
:root{color-scheme:dark;--ink:#e6d9c7;--dim:#aca09e;--stone:#222028;--border:#66575e;--gold:#dbba81}
*{box-sizing:border-box}body{margin:0;background:#141217;color:var(--ink);font-family:Georgia,serif}
main{max-width:1280px;margin:0 auto;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 5px 14px;flex-wrap:wrap}
.kicker{font:10px/1.4 monospace;letter-spacing:2px;color:#bba39e;margin:0 0 4px}
h1{font:normal clamp(20px,4vw,33px)/1.1 Georgia,serif;letter-spacing:1px;margin:0;color:#ead8bb}
.back{font:11px monospace;text-decoration:none;border:1px solid #715c56;color:#e4be92;padding:9px 12px}
.back:hover,.back:focus-visible{background:#3d2d35}
.frame{border:3px solid #66595f;box-shadow:0 0 0 2px #1a1319;overflow:hidden;background:#1b1820}
.scene{position:relative;width:100%;aspect-ratio:1672/941;isolation:isolate;overflow:hidden}
.art{width:100%;height:100%;display:block;object-fit:fill;image-rendering:auto;pointer-events:none;user-select:none}
.hotspots{position:absolute;inset:0;z-index:4;pointer-events:none}
.hotspot{display:block;position:absolute;border:0;background:transparent;pointer-events:auto;cursor:pointer;outline:none}
.hotspot:hover,.hotspot:focus-visible{filter:drop-shadow(0 0 7px #e8bb80)}
.hotspot:focus-visible{outline:2px dashed #f2cb94;outline-offset:-2px}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);padding:5px 9px;border:1px solid #ac8565;background:#16151be0;color:#f3deba;font:11px/1.4 monospace;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none}
.hotspot:hover::after,.hotspot:focus-visible::after{opacity:1;visibility:visible}
.stage-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ritual-light{position:absolute;left:41%;top:37%;width:20%;height:34%;background:radial-gradient(ellipse,#d37bc02d 0%,#bd47c60b 48%,transparent 72%);mix-blend-mode:screen;animation:breathe 4.4s ease-in-out infinite}
.fire-light{position:absolute;left:40%;top:52%;width:21%;height:19%;background:radial-gradient(ellipse,#ff8d422a,transparent 70%);mix-blend-mode:screen;animation:breathe 1.7s ease-in-out infinite reverse}
.candle-light{position:absolute;width:8%;height:16%;background:radial-gradient(ellipse,#ffb76f5a,transparent 67%);mix-blend-mode:screen;animation:flicker 1.7s steps(4,end) infinite}
.candle-one{left:10%;top:59%;animation-delay:-.7s}.candle-two{left:37%;top:55%;animation-delay:-1.3s}.candle-three{left:59%;top:57%;animation-delay:-.3s}.candle-four{left:90%;top:78%;animation-delay:-1s}
.wisp{position:absolute;left:49.2%;top:35.5%;width:1.5%;height:6%;border-radius:50%;filter:blur(4px);background:#e0a8f492;opacity:0;animation:drift 5.5s ease-out infinite}
.wisp.second{left:51%;top:35%;animation-delay:-2.8s;animation-duration:6.2s}
.spark{position:absolute;left:51%;top:58%;height:3px;width:3px;background:#ffd79d;box-shadow:0 0 5px #f79d67;animation:rise 3.4s ease-out infinite}
.spark.s2{left:46%;animation-delay:-1.3s}.spark.s3{left:54%;animation-delay:-2.1s;animation-duration:4.1s}
.leaf{position:absolute;top:-7%;width:8px;height:5px;background:#a25148;clip-path:polygon(0 0,100% 23%,75% 90%,20% 70%);opacity:0;animation:fall 19s linear infinite}
.leaf.l1{left:12%;animation-delay:-4s}.leaf.l2{left:84%;animation-delay:-12s;background:#92464c}.leaf.l3{left:94%;animation-delay:-2s;animation-duration:24s}
.ochacha-zone{position:absolute;left:63.8%;top:64%;width:18%;height:18%;z-index:5;cursor:pointer;border:0;background:transparent}
.ochacha-zone:focus-visible{outline:2px dashed #d8b880}
.sleep{position:absolute;left:70%;top:65%;z-index:3;color:#f5e9db;font:700 clamp(9px,2vw,20px) monospace;letter-spacing:2px;transform:rotate(-12deg);opacity:0;animation:zzz 3.4s ease-in-out infinite;pointer-events:none;text-shadow:0 0 5px #704a67}
.halo-light{position:absolute;left:66.7%;top:66.1%;width:6%;height:4%;border-radius:50%;background:radial-gradient(ellipse,#ffdf9161,transparent 72%);animation:breathe 3.2s ease-in-out infinite}
.dialogue{position:absolute;z-index:8;right:13%;bottom:16%;max-width:35%;padding:10px 12px;color:#f5e5ce;background:#1c161eea;border:1px solid #b69378;font:italic clamp(11px,1.45vw,16px)/1.4 Georgia,serif;box-shadow:3px 4px #131018}
.scene > .dialogue{right:auto;bottom:auto;max-width:min(35%,290px);width:max-content}
/* Desktop speech is a real child of Ochacha's moving hitbox:
   it inherits the SAME position, even between animation frames. */
.ochacha-zone > .dialogue{
 display:block;position:absolute;left:50%;bottom:calc(100% + 10px);
 top:auto;right:auto;transform:translateX(-50%);
 width:max-content;max-width:min(288px,34vw);min-width:190px;
 padding:10px 12px;text-align:center;white-space:normal;
 font:italic clamp(11px,1.35vw,15px)/1.4 Georgia,serif;
 pointer-events:none;overflow-wrap:break-word;
}
.ochacha-zone > .dialogue[hidden]{display:none}
@media(min-width:621px) and (max-width:850px){
 .ochacha-zone > .dialogue{min-width:160px;max-width:33vw;font-size:11px}
}
.dialogue[hidden]{display:none}
.panel{padding:15px;background:linear-gradient(#201b23,#15141a);border-top:1px solid #6d575d}
.section-title{font:11px/1.4 monospace;letter-spacing:1.3px;color:#c8b09d;margin:0 0 11px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.door{display:flex;align-items:center;min-height:45px;border:1px solid #5c5058;padding:8px 10px;gap:8px;color:#e8d7bd;background:#2c2630;text-decoration:none;font:12px/1.4 monospace;overflow-wrap:anywhere}
.door:before{content:'✧';color:#d5ae7f;font-size:14px}.door:hover,.door:focus-visible{border-color:#dfb38b;background:#493440}
.optional{color:#a39a96;font:11px/1.6 monospace;margin:12px 0 0}
.familiar-search{margin-top:12px;padding:10px;background:#1b1a21;border:1px solid #66555e}
.familiar-search[hidden]{display:none}
.familiar-search label{display:block;font:11px monospace;color:#f1d6b0;margin-bottom:6px}
.familiar-search input{width:100%;padding:9px;border:1px solid #816b69;color:#ecdac7;background:#302830;font:13px monospace;border-radius:0}
.familiar-search output{display:block;color:#afada7;font:11px monospace;margin-top:7px}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:.92;transform:scale(1.05)}}
@keyframes flicker{0%,100%{opacity:.65;transform:scale(1)}25%{opacity:.9;transform:scale(.88,1.04)}65%{opacity:.38;transform:scale(1.1,.95)}}
@keyframes drift{0%{opacity:0;transform:translate(-4px,8px) scale(.5)}20%{opacity:.4}75%{opacity:.28}100%{opacity:0;transform:translate(18px,-38px) scale(2.3)}}
@keyframes rise{0%{opacity:0;transform:translateY(5px)}20%{opacity:1}80%{opacity:.65}100%{opacity:0;transform:translate(9px,-49px)}}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%{opacity:.8}90%{opacity:.8}100%{opacity:0;transform:translate(70px,620px) rotate(280deg)}}
@keyframes zzz{0%,100%{opacity:0;transform:translate(0,6px) rotate(-12deg)}30%{opacity:1}75%{opacity:.8}95%{opacity:0;transform:translate(22px,-20px) rotate(-10deg)}}
@media(max-width:620px){main{padding:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.door{font-size:11px}.dialogue{max-width:65%;right:6%;bottom:14%}.hotspot::after{display:none}.leaf{width:5px;height:3px}}
@media(prefers-reduced-motion:reduce){.stage-fx *,.sleep,.halo-light{animation:none!important}.sleep{opacity:.75}}

.stage-fx,.sleep{display:none!important}
.fx-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;z-index:3}
.fx-switch{border:1px solid #a38b73;color:#edca9d;background:#2c2430;font:11px monospace;padding:9px;cursor:pointer;min-height:38px}
.fx-switch[aria-pressed=false]{color:#b6aca3;border-color:#5b525a}
.header-controls{display:flex;gap:6px;align-items:center}
@media(max-width:620px){.header-controls{width:100%;justify-content:flex-start;flex-wrap:wrap}.fx-switch{font-size:10px}}

/* Smaller unobtrusive motion control; animations launch automatically on mobile. */
.flame-fixes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;image-rendering:pixelated}
@media(max-width:620px){
 .fx-switch{width:29px;height:29px;min-height:29px;min-width:29px;padding:0;background:#27202c;border:1px solid #675664;display:grid;place-items:center;font-size:0;line-height:1;border-radius:50%}
 .fx-switch::after{content:'Ⅱ';font:16px Georgia,serif;color:#e8c699}
 .fx-switch[aria-pressed="false"]::after{content:'▶';font-size:12px}
 .fx-switch:focus-visible{outline:2px solid #e8c699;outline-offset:2px}
}
/* Ochacha: separate actor drawn over a clean cushion, independent of the artwork. */
.familiar-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;pointer-events:none;z-index:5}
.ochacha-zone{z-index:7!important;left:68%;top:65%;width:11%;height:15%;border-radius:45%;touch-action:manipulation}
.ochacha-zone:hover{filter:none}
@media(max-width:620px){.dialogue{position:relative;right:auto;bottom:auto;max-width:100%;padding:9px 11px;margin:0 0 9px;font-size:13px}.familiar-search input{font-size:16px;min-height:43px}}


</style>

/* Flame atlas QA: some genuine candles were omitted from the old handpicked
   transparent sprite sheet. Recover only the MISSING tips from their own pixels,
   mask those painted cores, and move the extracted tips. No duplicate flame.
   Corrections are limited to small 24×31 pixel regions. */
let recoveredFlames=null;
const recoveredIndexes=new Set();
let flameFixOverlay=null;
function prepareMissingFlames(){
 const art=document.querySelector('.art');
 if(!art||!art.complete||!art.naturalWidth)return;
 const src=document.createElement('canvas');src.width=1672;src.height=941;
 const srcCtx=src.getContext('2d',{willReadFrequently:true});
 srcCtx.drawImage(art,0,0,1672,941);
 const originalPixels=srcCtx.getImageData(0,0,1672,941);
 const atlas=document.createElement('canvas');atlas.width=1672;atlas.height=941;
 const aCtx=atlas.getContext('2d');
 const atlasPixels=aCtx.createImageData(1672,941);
 const repairs=document.createElement('canvas');repairs.width=1672;repairs.height=941;
 const rCtx=repairs.getContext('2d');
 const repaired=rCtx.createImageData(1672,941);
 const known=document.createElement('canvas');known.width=1672;known.height=941;
 const kCtx=known.getContext('2d',{willReadFrequently:true});
 kCtx.drawImage(images.flames,0,0);
 const knownPixels=kCtx.getImageData(0,0,1672,941).data;
 const raw=originalPixels.data,ra=atlasPixels.data,rr=repaired.data,W=1672;
 const idx=(x,y)=>(y*W+x)*4;
 for(let ci=0;ci<candleCenters.length;ci++){
   const [cx,cy]=candleCenters[ci];
   let existing=0;
   for(let y=cy-23;y<cy+7;y++)for(let x=cx-12;x<cx+12;x++){
     if(x<0||y<0||x>=1672||y>=941)continue;
     if(knownPixels[idx(x,y)+3]>55)existing++;
   }
   if(existing>=12)continue;
   const mask=[];
   for(let y=cy-22;y<cy+3;y++)for(let x=cx-11;x<cx+12;x++){
     if(x<0||y<0||x>=1672||y>=941)continue;
     const off=idx(x,y),R=raw[off],G=raw[off+1],B=raw[off+2];
     // A warm orange pixel in the flame envelope, not candle wax or beige stone.
     const hot=(R>175 && G>88 && R-B>65 && G-B>38 && R-G>17);
     if(hot)mask.push([x,y]);
   }
   if(mask.length<7||mask.length>190)continue;
   // Include one-pixel flame edge for an intact moving sprite.
   const wanted=new Set();
   for(const [x,y] of mask)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
     if(x+dx>0&&x+dx<1672&&y+dy>0&&y+dy<941)wanted.add((y+dy)*W+x+dx);
   }
   for(const at of wanted){
     const j=at*4,x=at%W,y=Math.floor(at/W);
     ra[j]=raw[j];ra[j+1]=raw[j+1];ra[j+2]=raw[j+2];ra[j+3]=255;
     // Replace just the static flame pixels with nearby background tone;
     // prefer a dark unobstructed pixel rather than the wax.
     const lx=Math.max(0,x-14),rx=Math.min(W-1,x+14);
     const left=idx(lx,y),right=idx(rx,y);
     const choose=(raw[left]+raw[left+1]+raw[left+2] <
                   raw[right]+raw[right+1]+raw[right+2])?left:right;
     for(let c=0;c<3;c++)rr[j+c]=raw[choose+c];
     rr[j+3]=255;
   }
   recoveredIndexes.add(ci);
 }
 if(recoveredIndexes.size){
   aCtx.putImageData(atlasPixels,0,0);
   rCtx.putImageData(repaired,0,0);
   repairs.className='flame-fixes';repairs.setAttribute('aria-hidden','true');
   document.querySelector('.scene').insertBefore(repairs,document.querySelector('.stage-fx'));
   flameFixOverlay=repairs;
   recoveredFlames=atlas;
 }
}

function redraw(t){
 g.clearRect(0,0,1672,941);
 // EXACT same smoke pixels but translated in moving thin strips; never a second plume.
 const smoke=images.smoke;
 for(let y=0;y<smoke.height;y+=3){
  const h=Math.min(3,smoke.height-y);
  const f=y/smoke.height;
  const dx=Math.sin(t*.92+f*8.6)*9+Math.sin(t*.31+f*11.1)*3;
  const dy=Math.sin(t*.56+f*5.2)*2;
  g.drawImage(smoke,0,y,smoke.width,h,690+dx,205+y+dy,smoke.width,h+1);
 }
 // Fire is its own transparent sprite, no flames painted below it.
 const hearth=images.hearth;
 const fireStretch=.98+.042*Math.sin(t*6.4);
 g.globalAlpha=.83+.16*Math.sin(t*4.5)**2;
 g.drawImage(hearth,730,536+hearth.height*(1-fireStretch),hearth.width,hearth.height*fireStretch);
 g.globalAlpha=1;
 // Individual original flame sprites are time-offset, not painted on static fire.
 const flames=images.flames;
 candleCenters.forEach(([x,y],i)=>{
  const pulse=Math.sin(t*(3.8+.15*(i%5))+i*1.75);
  const dx=2.1*pulse;
  const stretch=1+.11*Math.sin(t*(4.2+.2*(i%3))+i*2.1);
  const sx=x-12,sy=y-23;
  g.globalAlpha=.93;
  g.drawImage(flames,sx,sy,24,30,sx+dx,sy+(1-stretch)*22,24,30*stretch);
  if(recoveredFlames&&recoveredIndexes.has(i)){
   g.drawImage(recoveredFlames,sx,sy,24,30,sx+dx,sy+(1-stretch)*22,24,30*stretch);
  }
 });
 g.globalAlpha=1;
 // Just a few environmental leaves; no glow layers that obscure the artwork.
 leaves.forEach((leaf,i)=>{
  const progress=(t/leaf.slowness+leaf.phase)%1;
  const x=leaf.x+33*Math.sin(t*.71+i)-14*progress;
  const y=(progress*1030)-54;
  g.globalAlpha=.5*Math.sin(progress*Math.PI);
  g.fillStyle=i%2?'#a7504b':'#8e3e4b';
  g.fillRect(x,y,9,4);g.fillRect(x+3,y+4,5,3);
 });
 g.globalAlpha=1;
}
function animate(ms){
 if(!active||document.hidden){running=false;return}
 if(ms-lastFrame>73){redraw(ms/1000);lastFrame=ms}
 requestAnimationFrame(animate);
}
function setActive(on){
 active=on;
 toggle.setAttribute('aria-pressed',String(on));
 toggle.setAttribute('aria-label',on?'Pause room animations':'Play room animations');
 toggle.textContent=on?'✦ ANIMATIONS · ON':'✧ ANIMATIONS · OFF';
 if(!on&&flameFixOverlay)flameFixOverlay.style.visibility='visible';
 if(on&&!running&&!document.hidden){running=true;requestAnimationFrame(animate)}
}
toggle.addEventListener('click',()=>setActive(!active));
document.addEventListener('visibilitychange',()=>{if(document.hidden){g.clearRect(0,0,1672,941);running=false}else if(active&&!running){running=true;requestAnimationFrame(animate)}});
loaded.then(()=>{prepareMissingFlames();setActive(true)}).catch(err=>{toggle.textContent='ANIMATION UNAVAILABLE';toggle.disabled=true;console.error(err)});

/* OCHACHA POLISH PASS — deterministic per-hop state machine.
   No sliding interpolation across a whole room. Each hop has crouch,
   airborne arc, landing and a real stationary pause; all pixel-snapped.
   This routine runs independently of ambient animation and OS reduced-motion.
   The visitor can use the small animation control to stop all movement. */
const familiarCanvas=document.getElementById('familiar-canvas');
const familiarCtx=familiarCanvas.getContext('2d',{alpha:true});
familiarCtx.imageSmoothingEnabled=false;
const familiarButton=document.getElementById('ochacha');
const familiarPose={};
const familiarLoaded=Promise.all(Object.entries(FAMILIAR_SPRITES).map(([key,url])=>new Promise((resolve,reject)=>{
 const sprite=new Image();
 sprite.onload=()=>{familiarPose[key]=sprite;resolve()};
 sprite.onerror=()=>reject(new Error('Ochacha sprite could not load: '+key));
 sprite.src=url;
})));
const HOME={x:1210,feet:743};
const BOOK={x:445,feet:778};
const ROUTE=[
 HOME,
 {x:1102,feet:754},
 {x:994,feet:768},
 {x:884,feet:782},
 {x:775,feet:795},
 {x:668,feet:791},
 {x:555,feet:785},
 BOOK
];
const HOP={crouch:90,flight:520,land:170};
const STEP_MS=HOP.crouch+HOP.flight+HOP.land;
const TRIP_MS=(ROUTE.length-1)*STEP_MS;
const STAGES=[
 {name:'sleep',ms:6200},
 {name:'wake',ms:1300},
 {name:'hopToBook',ms:TRIP_MS},
 {name:'inspect',ms:3000},
 {name:'hopBack',ms:TRIP_MS},
 {name:'sleepAgain',ms:1900}
];
let cycleLength=0;
for(const stage of STAGES){stage.start=cycleLength;cycleLength+=stage.ms}
let familiarStart=0,familiarLast=0,familiarRunning=false,familiarReady=false,hiddenAt=null;
let userPausedAt=null;
const clamp01=v=>Math.max(0,Math.min(1,v));
function segmentHop(stage,within){
 const points=stage==='hopBack'?ROUTE.slice().reverse():ROUTE;
 const step=Math.min(points.length-2,Math.floor(within/STEP_MS));
 const m=within-step*STEP_MS;
 const a=points[step],b=points[step+1];
 const direction=b.x<a.x?'left':'right';
 if(m<HOP.crouch)return {pose:'sit',x:a.x,feet:a.feet,lift:0,direction,landed:true};
 if(m>=HOP.crouch+HOP.flight)return {pose:'sit',x:b.x,feet:b.feet,lift:0,direction,landed:true};
 const t=clamp01((m-HOP.crouch)/HOP.flight);
 // Separate ballistic jump arc, no easing through the floor.
 const lift=Math.round(4*29*t*(1-t));
 return {
  pose:t<.075||t>.965?'sit':'hop',
  x:Math.round(a.x+(b.x-a.x)*t),
  feet:Math.round(a.feet+(b.feet-a.feet)*t),
  lift,
  direction,
  landed:false
 };
}
function familiarState(timeMs){
 const phase=((timeMs-familiarStart)%cycleLength+cycleLength)%cycleLength;
 const stage=STAGES.find(s=>phase<s.start+s.ms)||STAGES[0];
 const within=phase-stage.start;
 let state={pose:'sleep',x:HOME.x,feet:HOME.feet,lift:0,direction:'left',landed:true};
 if(stage.name==='wake'){
  state={...state,pose:'sit'};
 }else if(stage.name==='hopToBook'||stage.name==='hopBack'){
  state=segmentHop(stage.name,within);
 }else if(stage.name==='inspect'){
  state={...state,pose:'sit',x:BOOK.x,feet:BOOK.feet,direction:'left'};
 }else if(stage.name==='sleepAgain'&&within<700){
  state={...state,pose:'sit'};
 }
 return {...state,stage:stage.name};
}
function drawFacingSprite(img,x,y,w,h,facing,cx){
 familiarCtx.save();
 if(facing==='left'){
  familiarCtx.translate(Math.round(cx)*2,0);
  familiarCtx.scale(-1,1);
 }
 familiarCtx.drawImage(img,Math.round(x),Math.round(y),w,h);
 familiarCtx.restore();
}
function drawFamiliar(timeMs){
 if(!familiarReady)return;
 familiarCtx.clearRect(0,0,1672,941);
 const stage=familiarState(timeMs);
 const {pose,x,feet,lift,direction}=stage;
 document.getElementById('scene').dataset.ochachaStage=stage.stage;
 const sprite=familiarPose[pose];
 if(!sprite)return;
 const w=pose==='sleep'?188:pose==='sit'?108:124;
 const h=pose==='sleep'?99:pose==='sit'?122:115;
 // A soft contact shadow remains on the floor while the body is airborne.
 if(pose!=='sleep'){
  familiarCtx.save();
  familiarCtx.globalAlpha=Math.max(.16,.34-lift*.006);
  familiarCtx.fillStyle='#17141a';
  familiarCtx.beginPath();
  familiarCtx.ellipse(Math.round(x),Math.round(feet+2),Math.max(13,30-lift*.26),4.3,0,0,Math.PI*2);
  familiarCtx.fill();
  familiarCtx.restore();
 }
 const breath=pose==='sleep'?Math.round(Math.sin(timeMs/950)*1.1):0;
 const top=Math.round(feet-h-lift+breath);
 drawFacingSprite(sprite,x-w/2,top,w,h,direction,x);
 if(pose==='sleep'){
  familiarCtx.save();
  familiarCtx.globalAlpha=.28+.44*(.5+.5*Math.sin(timeMs/800));
  familiarCtx.fillStyle='#e9d6c6';
  familiarCtx.font='bold 17px Georgia,serif';
  familiarCtx.fillText('z',Math.round(x+72),Math.round(feet-110-(timeMs%2000)/130));
  familiarCtx.font='bold 11px Georgia,serif';
  familiarCtx.fillText('z',Math.round(x+87),Math.round(feet-124-(timeMs%2000)/155));
  familiarCtx.restore();
 }
 // The invisible click region follows the sprite but never changes its state.
 familiarButton.style.left=((x-w/2)/1672*100)+'%';
 familiarButton.style.top=(top/941*100)+'%';
 familiarButton.style.width=(w/1672*100)+'%';
 familiarButton.style.height=(h/941*100)+'%';
 // The familiar's hitbox follows him at EVERY stage, including airborne hops.
 familiarButton.style.pointerEvents='auto';
}
function familiarTick(now){
 if(!familiarReady||document.hidden){familiarRunning=false;return}
 const toggle=document.getElementById('fx-switch');
 if(toggle&&toggle.getAttribute('aria-pressed')==='false'){
   if(userPausedAt===null)userPausedAt=now;
   requestAnimationFrame(familiarTick);
   return;
 }
 if(userPausedAt!==null){familiarStart+=now-userPausedAt;userPausedAt=null}
 if(now-familiarLast>55){familiarLast=now;drawFamiliar(now)}
 requestAnimationFrame(familiarTick);
}
function startFamiliar(){
 if(!familiarReady||familiarRunning||document.hidden)return;
 familiarRunning=true;
 familiarLast=0;
 requestAnimationFrame(familiarTick);
}
// Existing click handler opens Ochacha's notes; it must NEVER pause or reset movement.
familiarButton.setAttribute('aria-expanded','false');
familiarButton.setAttribute('aria-label','Open Ochacha familiar notes');
// On small displays, show the message beneath the illustration and do not summon the keyboard.
if(window.matchMedia('(max-width:620px)').matches){
 document.querySelector('.panel').prepend(document.getElementById('dialogue'));
}else{
 // The dialogue moves with the hitbox as its child: no floating fixed coordinates.
 familiarButton.appendChild(document.getElementById('dialogue'));
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){hiddenAt=performance.now();userPausedAt=null;familiarRunning=false}
 else{
   if(hiddenAt!==null){familiarStart+=performance.now()-hiddenAt;hiddenAt=null}
   startFamiliar();
 }
});
window.addEventListener('pageshow',()=>startFamiliar());
familiarLoaded.then(()=>{
 familiarReady=true;
 familiarStart=performance.now();
 drawFamiliar(familiarStart);
 startFamiliar();
}).catch(error=>{
 console.error(error);
 familiarButton.setAttribute('aria-label','Ochacha image could not load');
});

})();
</script>

<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>The Witch's Lair · Pixel Wheel</title>
<style>
:root{color-scheme:dark;--bg:#120a20;--border:#754995;--text:#f3e1ff;--purple:#d7a5ff}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:Consolas,"Courier New",monospace}
.hud{max-width:660px;min-height:184px;margin:auto;padding:12px 15px 10px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 25% 45%,#40245b99,transparent 66%),repeating-linear-gradient(0deg,transparent 0 3px,#ffffff05 3px 4px),linear-gradient(110deg,#120a20,#1c0f2a 64%,#130b20);border:3px solid #603a87;outline:1px solid #251331;box-shadow:inset 0 0 0 2px #1b0d29,inset 0 0 0 4px #9165bf27}
.hud:before,.hud:after{content:"";position:absolute;width:7px;height:7px;background:#c992ff;box-shadow:0 0 0 2px #1b0f2b}.hud:before{top:4px;left:4px}.hud:after{bottom:4px;right:4px}
header{display:flex;justify-content:space-between;gap:8px;align-items:center;padding-bottom:7px;border-bottom:1px dashed #62417e}.logo{font-size:11px;letter-spacing:1.3px;color:#d6aafa;font-weight:bold}.live{font-size:9px;letter-spacing:1px;color:#ad8acb;white-space:nowrap}.live:before{content:"";display:inline-block;vertical-align:middle;width:6px;height:6px;margin-right:7px;background:#91d7b2;box-shadow:0 0 6px #70c89e}
.body{display:grid;grid-template-columns:140px minmax(0,1fr);align-items:center;gap:14px;padding:5px 0}.wheel{width:140px;height:132px;display:grid;place-items:center;background:radial-gradient(circle,#48305e66,transparent 74%)}svg{width:135px;height:135px;display:block}#segments{transform-origin:80px 80px;transition:transform .7s steps(8,end)}.wedge{stroke:#150b21;stroke-width:2;shape-rendering:crispEdges}
.eyebrow{font-size:9px;letter-spacing:1.5px;color:#ae8bcf;font-weight:bold}.date{font-size:16px;line-height:1.65;color:#f5e5ff;letter-spacing:1.1px;white-space:nowrap;font-weight:bold}.chapter{font-size:clamp(22px,4vw,28px);color:#d9acff;font-weight:bold;text-shadow:2px 2px #3c1b56;letter-spacing:1.8px;line-height:1.25}.next{margin-top:6px;font-size:11px;color:#c59eda;font-weight:bold}.next strong{color:#f8e9ff}
.steps{display:flex;gap:4px;max-width:315px;padding-top:10px}.step{height:8px;min-width:0;flex:1;background:#2a183c;border:1px solid #4c2f69}.step.past{background:#684887}.step.active{background:#d3a2fc;border-color:#efcfff;box-shadow:0 0 7px #a565c9}
footer{display:flex;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px dashed #47315f;font-size:8px;letter-spacing:.45px;color:#806a9e;font-weight:bold}
@media(max-width:450px){.hud{padding:9px 10px 8px;min-height:169px}.logo{font-size:9px;letter-spacing:0}.live{font-size:8px;letter-spacing:0}.body{grid-template-columns:107px minmax(0,1fr);gap:6px;padding:5px 0 4px}.wheel{width:107px;height:111px}svg{width:108px;height:108px}.eyebrow{font-size:8px;letter-spacing:1px}.date{font-size:12px;letter-spacing:0}.chapter{font-size:20px;letter-spacing:.5px}.next{font-size:9px;margin-top:4px}.steps{gap:3px;padding-top:7px}.step{height:7px}footer{font-size:7px;letter-spacing:0}}@media(prefers-reduced-motion:reduce){#segments{transition:none}}
</style></head><body>
<div class="hud" role="region" aria-label="Ruota dell'Anno pixel, Tokyo, aggiornamento automatico">
<header><span class="logo">✦ THE WITCH'S LAIR / WHEEL HUD</span><span class="live">AUTO · JST</span></header>
<div class="body"><div class="wheel"><svg viewBox="0 0 160 160" role="img" aria-label="Ruota delle otto stagioni">
<g fill="none" stroke="#5b3e7b" shape-rendering="crispEdges"><rect x="12" y="12" width="136" height="136" stroke-dasharray="4 3" opacity=".7"/><rect x="22" y="22" width="116" height="116" opacity=".3"/></g><g id="segments"></g><path d="M80 3 L72 19 L88 19 Z" fill="#e6bbff" stroke="#44215f" stroke-width="2"/><rect x="51" y="51" width="58" height="58" fill="#130a20" stroke="#9c6cca" stroke-width="3" shape-rendering="crispEdges"/><rect x="56" y="56" width="48" height="48" fill="#241333" stroke="#4a2c69" shape-rendering="crispEdges"/><text id="glyph" x="80" y="78" text-anchor="middle" fill="#efd2ff" font-family="monospace" font-size="24">☾</text><text id="number" x="80" y="95" text-anchor="middle" fill="#b999d3" font-family="monospace" font-size="9" font-weight="bold">08/08</text></svg></div>
<div class="info"><div class="eyebrow">TODAY // TOKYO</div><div class="date" id="today">DOM 08 NOV 2026</div><div class="eyebrow">CURRENT CHAPTER</div><div class="chapter" id="sabbat">SAMHAIN</div><div class="next">▸ NEXT: <strong id="next">YULE · 21 DIC</strong> <span id="days">[43D]</span></div><div class="steps" id="steps" aria-label="Otto stagioni"></div></div></div>
<footer><span>☽ NORTHERN HEMISPHERE · CONVENTIONAL DATES</span><span>8 SEASONS / 1 CYCLE</span></footer></div>
<script>
(function(){
"use strict";
var wheel=[{name:"YULE",m:12,d:21,g:"✦"},{name:"IMBOLC",m:2,d:1,g:"✧"},{name:"OSTARA",m:3,d:20,g:"❀"},{name:"BELTANE",m:5,d:1,g:"❦"},{name:"LITHA",m:6,d:21,g:"☼"},{name:"LUGHNASADH",m:8,d:1,g:"✺"},{name:"MABON",m:9,d:22,g:"❧"},{name:"SAMHAIN",m:10,d:31,g:"☾"}];
var ns="http://www.w3.org/2000/svg",rotor=document.getElementById("segments"),track=document.getElementById("steps"),wedges=[],bars=[],mons=["GEN","FEB","MAR","APR","MAG","GIU","LUG","AGO","SET","OTT","NOV","DIC"];
function polar(r,d){var a=(d-90)*Math.PI/180;return [80+r*Math.cos(a),80+r*Math.sin(a)]}
function seg(i){var a=i*45-21,b=a+42,p=polar(29,a),q=polar(63,a),r=polar(63,b),s=polar(29,b);return "M "+p.join(" ")+" L "+q.join(" ")+" A 63 63 0 0 1 "+r.join(" ")+" L "+s.join(" ")+" A 29 29 0 0 0 "+p.join(" ")+" Z"}
wheel.forEach(function(w,i){var p=document.createElementNS(ns,"path");p.setAttribute("d",seg(i));p.setAttribute("class","wedge");rotor.appendChild(p);wedges.push(p);var b=document.createElement("div");b.className="step";b.title=w.name;track.appendChild(b);bars.push(b)});
function tokyo(){var p={};new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date()).forEach(function(i){if(["year","month","day"].indexOf(i.type)>=0)p[i.type]=Number(i.value)});return p}
function tick(){var d=tokyo(),now=Date.UTC(d.year,d.month-1,d.day),ev=[];for(var y=d.year-1;y<=d.year+1;y++)wheel.forEach(function(w,i){ev.push({i:i,t:Date.UTC(y,w.m-1,w.d)})});ev.sort(function(a,b){return a.t-b.t});var cur=ev[0],nxt=ev[1];for(var j=0;j<ev.length-1;j++){if(now>=ev[j].t&&now<ev[j+1].t){cur=ev[j];nxt=ev[j+1];break}}
var w=wheel[cur.i],n=wheel[nxt.i],days=Math.round((nxt.t-now)/86400000),weekday=new Intl.DateTimeFormat("it-IT",{timeZone:"Asia/Tokyo",weekday:"short"}).format(new Date()).replace(".","").toUpperCase();
document.getElementById("today").textContent=weekday+" "+String(d.day).padStart(2,"0")+" "+mons[d.month-1]+" "+d.year;document.getElementById("sabbat").textContent=w.name;document.getElementById("next").textContent=n.name+" · "+String(n.d).padStart(2,"0")+" "+mons[n.m-1];document.getElementById("days").textContent="["+days+"D]";document.getElementById("glyph").textContent=w.g;document.getElementById("number").textContent=String(cur.i+1).padStart(2,"0")+"/08";
wedges.forEach(function(p,i){p.setAttribute("fill",i===cur.i?"#c18aef":i%2?"#493063":"#372449");p.setAttribute("stroke",i===cur.i?"#efd1ff":"#13081e")});bars.forEach(function(b,i){b.className="step"+(i===cur.i?" active":i<cur.i?" past":"")});rotor.style.transform="rotate("+(-45*cur.i)+"deg)"}
tick();setInterval(tick,60000)})();
</script></body></html>

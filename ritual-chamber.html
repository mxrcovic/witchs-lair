<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#19161c"><title>The Witch’s Lair · Ritual Chamber — Master Scene</title>
<style>
:root{color-scheme:dark;--ink:#e6d9c7;--dim:#aca09e;--stone:#222028;--border:#66575e;--gold:#dbba81}
*{box-sizing:border-box}body{margin:0;background:#141217;color:var(--ink);font-family:Georgia,serif}
main{max-width:1280px;margin:0 auto;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 5px 14px;flex-wrap:wrap}
.kicker{font:10px/1.4 monospace;letter-spacing:2px;color:#bba39e;margin:0 0 4px}
h1{font:normal clamp(20px,4vw,33px)/1.1 Georgia,serif;letter-spacing:1px;margin:0;color:#ead8bb}
.back{font:11px monospace;text-decoration:none;border:1px solid #715c56;color:#e4be92;padding:9px 12px}
.back:hover,.back:focus-visible{background:#3d2d35}
.frame{border:3px solid #66595f;box-shadow:0 0 0 2px #1a1319;overflow:hidden;background:#1b1820}
.scene{position:relative;width:100%;aspect-ratio:1672/941;isolation:isolate;overflow:hidden}
.art{width:100%;height:100%;display:block;object-fit:fill;image-rendering:auto;pointer-events:none;user-select:none}
.hotspots{position:absolute;inset:0;z-index:4;pointer-events:none}
.hotspot{display:block;position:absolute;border:0;background:transparent;pointer-events:auto;cursor:pointer;outline:none}
.hotspot:hover,.hotspot:focus-visible{filter:drop-shadow(0 0 7px #e8bb80)}
.hotspot:focus-visible{outline:2px dashed #f2cb94;outline-offset:-2px}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);padding:5px 9px;border:1px solid #ac8565;background:#16151be0;color:#f3deba;font:11px/1.4 monospace;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none}
.hotspot:hover::after,.hotspot:focus-visible::after{opacity:1;visibility:visible}
.stage-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ritual-light{position:absolute;left:41%;top:37%;width:20%;height:34%;background:radial-gradient(ellipse,#d37bc02d 0%,#bd47c60b 48%,transparent 72%);mix-blend-mode:screen;animation:breathe 4.4s ease-in-out infinite}
.fire-light{position:absolute;left:40%;top:52%;width:21%;height:19%;background:radial-gradient(ellipse,#ff8d422a,transparent 70%);mix-blend-mode:screen;animation:breathe 1.7s ease-in-out infinite reverse}
.candle-light{position:absolute;width:8%;height:16%;background:radial-gradient(ellipse,#ffb76f5a,transparent 67%);mix-blend-mode:screen;animation:flicker 1.7s steps(4,end) infinite}
.candle-one{left:10%;top:59%;animation-delay:-.7s}.candle-two{left:37%;top:55%;animation-delay:-1.3s}.candle-three{left:59%;top:57%;animation-delay:-.3s}.candle-four{left:90%;top:78%;animation-delay:-1s}
.spark{position:absolute;left:51%;top:58%;height:3px;width:3px;background:#ffd79d;box-shadow:0 0 5px #f79d67;animation:rise 3.4s ease-out infinite}
.spark.s2{left:46%;animation-delay:-1.3s}.spark.s3{left:54%;animation-delay:-2.1s;animation-duration:4.1s}
.leaf{position:absolute;top:-7%;width:8px;height:5px;background:#a25148;clip-path:polygon(0 0,100% 23%,75% 90%,20% 70%);opacity:0;animation:fall 19s linear infinite}
.leaf.l1{left:12%;animation-delay:-4s}.leaf.l2{left:84%;animation-delay:-12s;background:#92464c}.leaf.l3{left:94%;animation-delay:-2s;animation-duration:24s}
.ochacha-zone{position:absolute;left:63.8%;top:64%;width:18%;height:18%;z-index:5;cursor:pointer;border:0;background:transparent}
.ochacha-zone:focus-visible{outline:2px dashed #d8b880}
.sleep{position:absolute;left:70%;top:65%;z-index:3;color:#f5e9db;font:700 clamp(9px,2vw,20px) monospace;letter-spacing:2px;transform:rotate(-12deg);opacity:0;animation:zzz 3.4s ease-in-out infinite;pointer-events:none;text-shadow:0 0 5px #704a67}
.halo-light{position:absolute;left:66.7%;top:66.1%;width:6%;height:4%;border-radius:50%;background:radial-gradient(ellipse,#ffdf9161,transparent 72%);animation:breathe 3.2s ease-in-out infinite}
.dialogue{position:absolute;z-index:8;right:13%;bottom:16%;max-width:35%;padding:10px 12px;color:#f5e5ce;background:#1c161eea;border:1px solid #b69378;font:italic clamp(11px,1.45vw,16px)/1.4 Georgia,serif;box-shadow:3px 4px #131018}
.dialogue[hidden]{display:none}
.panel{padding:15px;background:linear-gradient(#201b23,#15141a);border-top:1px solid #6d575d}
.section-title{font:11px/1.4 monospace;letter-spacing:1.3px;color:#c8b09d;margin:0 0 11px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.door{display:flex;align-items:center;min-height:45px;border:1px solid #5c5058;padding:8px 10px;gap:8px;color:#e8d7bd;background:#2c2630;text-decoration:none;font:12px/1.4 monospace;overflow-wrap:anywhere}
.door:before{content:'✧';color:#d5ae7f;font-size:14px}.door:hover,.door:focus-visible{border-color:#dfb38b;background:#493440}
.optional{color:#a39a96;font:11px/1.6 monospace;margin:12px 0 0}
.familiar-search{margin-top:12px;padding:10px;background:#1b1a21;border:1px solid #66555e}
.familiar-search[hidden]{display:none}
.familiar-search label{display:block;font:11px monospace;color:#f1d6b0;margin-bottom:6px}
.familiar-search input{width:100%;padding:9px;border:1px solid #816b69;color:#ecdac7;background:#302830;font:13px monospace;border-radius:0}
.familiar-search output{display:block;color:#afada7;font:11px monospace;margin-top:7px}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:.92;transform:scale(1.05)}}
@keyframes flicker{0%,100%{opacity:.65;transform:scale(1)}25%{opacity:.9;transform:scale(.88,1.04)}65%{opacity:.38;transform:scale(1.1,.95)}}
@keyframes drift{0%{opacity:0;transform:translate(-4px,8px) scale(.5)}20%{opacity:.4}75%{opacity:.28}100%{opacity:0;transform:translate(18px,-38px) scale(2.3)}}
@keyframes rise{0%{opacity:0;transform:translateY(5px)}20%{opacity:1}80%{opacity:.65}100%{opacity:0;transform:translate(9px,-49px)}}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%{opacity:.8}90%{opacity:.8}100%{opacity:0;transform:translate(70px,620px) rotate(280deg)}}
@keyframes zzz{0%,100%{opacity:0;transform:translate(0,6px) rotate(-12deg)}30%{opacity:1}75%{opacity:.8}95%{opacity:0;transform:translate(22px,-20px) rotate(-10deg)}}
@media(max-width:620px){main{padding:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.door{font-size:11px}.dialogue{max-width:65%;right:6%;bottom:14%}.hotspot::after{display:none}.leaf{width:5px;height:3px}}
/* Motion accessibility: the animation switch starts OFF when Reduce Motion is enabled. */
.door[hidden]{display:none!important}

/* Mobile stability: preserve the artwork while avoiding blend/blur-heavy layers, viewport jumps and iOS input zoom. */
@media(max-width:620px){
.scene{contain:layout paint;transform:translateZ(0)}
.stage-fx{contain:paint}
.ritual-light,.fire-light,.candle-light,.halo-light{mix-blend-mode:normal}
.leaf.l3,.spark.s3{display:none}
.dialogue{position:relative;right:auto;bottom:auto;max-width:100%;width:100%;margin:0 0 12px;box-shadow:none;padding:10px 12px;font-size:13px}
.familiar-search input{font-size:16px;min-height:44px}
.door{min-height:48px}
}


/* Independent pixel-animation overlay: visible on mobile without altering approved art. */
.life-canvas{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
.motion-toggle{border:1px solid #866c66;background:#29232c;color:#eed0a0;cursor:pointer;padding:9px 11px;font:11px/1.3 monospace;white-space:nowrap}
.motion-toggle[aria-pressed="false"]{color:#bab3ab;background:#201d23;border-color:#5d5559}
.motion-toggle:focus-visible{outline:2px solid #f0c98d;outline-offset:2px}
.motion-toggle:hover{border-color:#deae7a}
.header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
body.motion-paused .stage-fx *,body.motion-paused .sleep,body.motion-paused .halo-light{animation-play-state:paused!important}
body.motion-paused .leaf,body.motion-paused .spark{opacity:0!important}
@media(max-width:620px){.motion-toggle{min-height:38px;font-size:10px;padding:8px 9px}.header-actions{gap:6px}}

</style>

if(s.hotspot){const b=document.createElement('a');b.className='hotspot';b.href=a.href;b.target=a.target;b.rel=a.rel;b.dataset.label=s.name;b.setAttribute('aria-label','Open '+s.name+' in Notion');b.style.left=s.hotspot[0]+'%';b.style.top=s.hotspot[1]+'%';b.style.width=s.hotspot[2]+'%';b.style.height=s.hotspot[3]+'%';hotspots.appendChild(b)}
});
const box=document.getElementById('familiar-search'),dialogue=document.getElementById('dialogue'),search=document.getElementById('search'),out=document.getElementById('search-help');
/* On compact screens dialogue belongs below the illustration, not over Ochacha. */
if(window.matchMedia('(max-width:620px)').matches){document.querySelector('.panel').prepend(dialogue)}
document.getElementById('ochacha').addEventListener('click',()=>{
const open=box.hidden;box.hidden=!open;dialogue.hidden=!open;if(!open)return;
const day=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',day:'numeric'}).format(new Date()));
dialogue.textContent=day===1?'A new moon of work begins, Witch. Remember your monthly Codex review.':'A little nap, a little magic. What shall we study today?';
search.value='';out.textContent='Searches section titles only; this is not full-text Notion search.';
if(window.matchMedia('(hover: hover) and (pointer: fine)').matches){search.focus({preventScroll:true});}
});
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();doors.querySelectorAll('a').forEach((a,i)=>{a.hidden=!!q&&!a.textContent.toLowerCase().includes(q)});out.textContent=q?'Matching sections are shown above.':'Searches section titles only.'});

/* LIVING SCENE — independent pixel-art animation.
   Artwork stays unchanged; 836×471 transparent canvas scales with the scene.
   Animation is visible on iPhone, user-controllable and stops when hidden. */
const motionCanvas=document.getElementById('life-canvas');
const motionCtx=motionCanvas.getContext('2d',{alpha:true});
const motionButton=document.getElementById('motion-toggle');
const motionW=1672,motionH=941;
const stillArtwork=document.querySelector("img.art");
const originalGridW=836,originalGridH=471;
const toCanvasX=x=>x*motionW/originalGridW,toCanvasY=y=>y*motionH/originalGridH;
motionCtx.imageSmoothingEnabled=false;
const prefersReduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let motionActive=false,motionRunning=false,lastDraw=0;
function hash(n){const v=Math.sin(n*127.1+19.33)*43758.5453;return v-Math.floor(v)}
const motes=Array.from({length:34},(_,i)=>({x:hash(i*4+1)*motionW,y:hash(i*4+2)*motionH,s:hash(i*4+3),phase:hash(i*4+4)*7}));
const leaves=Array.from({length:10},(_,i)=>({x:hash(i*7+2)*motionW,phase:hash(i*7+7),speed:19+hash(i*7+5)*15,side:i%2?1:-1}));
const embers=Array.from({length:23},(_,i)=>({x:hash(i*2+11),phase:hash(i*2+12),speed:2+hash(i*2+13)*2}));
function square(x,y,w,h,color,alpha=1){
 motionCtx.globalAlpha=Math.max(0,Math.min(1,alpha));motionCtx.fillStyle=color;
 motionCtx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));
}
/* PIXEL-MOTION REPLACEMENT: warp pixels ALREADY IN THE ILLUSTRATION.
   Opaque sampled strips cover their original pixels, rather than superimposing
   a second candle or a second smoke plume. Approved image remains unchanged. */
function sampleStrip(x,y,w,h,dx=0,dy=0){
 const img=stillArtwork;
 if(!img.complete||!img.naturalWidth)return;
 const naturalX=img.naturalWidth/originalGridW;
 const naturalY=img.naturalHeight/originalGridH;
 motionCtx.globalAlpha=1;
 motionCtx.drawImage(img,
   (x+dx)*naturalX,(y+dy)*naturalY,w*naturalX,h*naturalY,
   toCanvasX(x),toCanvasY(y),toCanvasX(w),toCanvasY(h));
}
const CANDLE_TIPS=[
 [166,91],[178,97],[271,151],[280,157],
 [559,151],[567,157],[114,270],[125,264],
 [333,281],[346,288],[510,269],[519,281],
 [777,269],[792,254],[52,365],[81,387],
 [690,402],[717,392]
];
function warpCandle(cx,cy,i,t){
 const x=cx-10,w=20,yt=cy-12,yb=cy+10;
 const timing=t*(3.3+(i%4)*.31)+i*1.83;
 for(let y=yt;y<yb;y+=2){
   const env=Math.sin(Math.PI*(y-yt)/(yb-yt));
   const sideways=Math.sin(timing+y*.145)*2.2*env;
   const pulse=Math.sin(t*(4.7+(i%3)*.45)+i*2.2);
   // Stretch only the hot top region; keep the wax base in place.
   const vertical=y<cy?(y-cy)*(.075*pulse)*env:0;
   sampleStrip(x,y,w,2,sideways,vertical);
 }
}
function warpSmoke(t){
 const top=112,bottom=224,left=345,width=169;
 // Subtle S-shaped oscillation of the ORIGINAL violet plume, with no copy.
 for(let y=top;y<bottom;y+=3){
   const where=(y-top)/(bottom-top);
   const envelope=Math.sin(Math.PI*where)**2;
   const sway=(Math.sin(t*.88+y*.066)*3.5+
               Math.sin(t*.48-y*.11)*1.6)*envelope;
   sampleStrip(left,y,width,3,sway,0);
 }
}
function warpHearth(t){
 // The fire painted beneath the cauldron replaces itself, not an overlay.
 const x=376,w=106,yt=281,yb=314;
 for(let y=yt;y<yb;y+=2){
  const env=Math.sin(Math.PI*(y-yt)/(yb-yt));
  const sway=Math.sin(t*5.8+y*.54)*1.9*env;
  const scale=Math.sin(t*4.2+y*.2)*.9*env;
  sampleStrip(x,y,w,2,sway,scale);
 }
}
function lifeDraw(timeMs){
 const t=timeMs/1000;
 motionCtx.clearRect(0,0,motionW,motionH);
 if(!stillArtwork.complete||!stillArtwork.naturalWidth)return;
 // Each replacement patch is opaque and completely hides the original
 // static region beneath it. No separate smoke or flame is drawn.
 warpSmoke(t);
 warpHearth(t);
 for(let i=0;i<CANDLE_TIPS.length;i++){
   warpCandle(CANDLE_TIPS[i][0],CANDLE_TIPS[i][1],i,t);
 }
 // Independent atmospheric particles can still float over the artwork.
 for(const leaf of leaves){
   const progression=(t/leaf.speed+leaf.phase)%1;
   const yy=progression*(originalGridH+46)-23;
   const xx=leaf.x/2+Math.sin(t*.75+leaf.phase*12)*33+progression*35*leaf.side;
   const alpha=.16+.42*Math.sin(progression*Math.PI);
   motionCtx.globalAlpha=alpha;
   motionCtx.fillStyle=leaf.side>0?'#a9554e':'#b46a4b';
   motionCtx.fillRect(toCanvasX(xx),toCanvasY(yy),9,4);
 }
 for(const e of embers){
   const p=(t*e.speed/15+e.phase)%1;
   motionCtx.globalAlpha=.55*Math.sin(Math.PI*p);
   motionCtx.fillStyle=e.x>.5?'#ffd596':'#b76a50';
   const ex=416+(e.x-.5)*55+Math.sin(t+e.phase*10)*4;
   motionCtx.fillRect(toCanvasX(ex),toCanvasY(303-p*48),3,3);
 }
 motionCtx.globalAlpha=1;
}
function lifeLoop(now){
 if(!motionActive||document.hidden){motionRunning=false;motionCtx.clearRect(0,0,motionW,motionH);return}
 if(now-lastDraw>=75){lifeDraw(now);lastDraw=now}
 window.requestAnimationFrame(lifeLoop);
}
function setMotion(active){
 motionActive=!!active;
 motionButton.setAttribute('aria-pressed',String(motionActive));
 motionButton.textContent=motionActive?'✦ ANIMATIONS · ON':'✧ ANIMATIONS · OFF';
 motionButton.title=motionActive?'Pause ambient motion':'Animate the original candle flames and cauldron smoke without double overlays';
 document.body.classList.toggle('motion-paused',!motionActive);
 if(motionActive&&!motionRunning&&!document.hidden){motionRunning=true;lastDraw=0;window.requestAnimationFrame(lifeLoop)}
 if(!motionActive){motionCtx.clearRect(0,0,motionW,motionH)}
}
motionButton.addEventListener('click',()=>setMotion(!motionActive));
document.addEventListener('visibilitychange',()=>{if(document.hidden){motionCtx.clearRect(0,0,motionW,motionH)}else if(motionActive&&!motionRunning){motionRunning=true;window.requestAnimationFrame(lifeLoop)}});
setMotion(!prefersReduced);

})();
</script>
